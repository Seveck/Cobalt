[package]
name = "cobalt-mcp"
description = "[CLAUDE] Single-daemon RPC, stdio bridge, MCP server (7 tools), REST/WS API and MCP Doctor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
cobalt-core.workspace = true
chrono.workspace = true
uuid.workspace = true
futures-util = "0.3"
hex = "0.4"
sha2 = "0.11"
rand = "0.10"
interprocess = { version = "2.4.10", features = ["tokio"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing.workspace = true
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }
toml_edit = "0.25.21"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
cobalt-store.workspace = true
cobalt-embeddings.workspace = true
