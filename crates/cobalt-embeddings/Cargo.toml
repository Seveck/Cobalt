[package]
name = "cobalt-embeddings"
description = "[CODEX] Embedding providers (fastembed ONNX, Ollama) and tiktoken-rs token counting."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cobalt-core.workspace = true
async-trait = "0.1"
fastembed = { version = "5.16", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tiktoken-rs = "0.12"
tokio = { version = "1", features = ["rt", "sync"] }

[lints]
workspace = true
