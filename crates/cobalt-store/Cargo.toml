[package]
name = "cobalt-store"
description = "[CODEX] Canonical SQLite (WAL + FTS5) store, hybrid RRF search, vector engines, governance, telemetry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
qdrant = ["dep:reqwest"]
chroma = ["dep:reqwest"]
lancedb = ["dep:lancedb", "dep:arrow-array", "dep:arrow-schema", "dep:futures-util"]

[dependencies]
cobalt-core.workspace = true
cobalt-embeddings = { path = "../cobalt-embeddings" }
chrono.workspace = true
async-trait.workspace = true
rusqlite = { version = "0.43", features = ["backup", "bundled"] }
serde_json.workspace = true
serde.workspace = true
sha2 = "0.11"
hex = "0.4"
sqlite-vec = "0.1.9"
tempfile = "3"
tokio.workspace = true
unicode_categories = "0.1"
usearch = { version = "2.26", default-features = false }

reqwest = { version = "0.13", optional = true, default-features = false, features = ["json", "rustls"] }
lancedb = { version = "0.30", optional = true, default-features = false }
arrow-array = { version = "58", optional = true }
arrow-schema = { version = "58", optional = true }
futures-util = { version = "0.3", optional = true }

[lints]
workspace = true
