[package]
name = "cobalt-store"
description = "[CODEX] Canonical SQLite (WAL + FTS5) store, hybrid RRF search, vector engines, governance, telemetry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cobalt-core.workspace = true
async-trait = "0.1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
sqlite-vec = "=0.1.6"
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync"] }
usearch = { version = "2.26", default-features = false }

[dev-dependencies]
cobalt-embeddings = { path = "../cobalt-embeddings" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
