[package]
name = "cobalt-ingest"
description = "[CODEX] Chunking, file watcher, OCR, PDF, Past-Life importer, capsules and universal backups."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cobalt-core.workspace = true
cobalt-store = { path = "../cobalt-store" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
hex = "0.4"
sha2 = "0.11"
lopdf = { version = "0.40", default-features = false }
flate2 = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
ocrs = { version = "0.14.0", default-features = false, features = ["onnx"] }
rten = { version = "0.28.0", default-features = false, features = ["onnx_format"] }
notify = "8"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate-flate2", "zstd"] }

[dev-dependencies]
cobalt-core = { workspace = true, features = ["engines"] }
cobalt-embeddings = { path = "../cobalt-embeddings" }

[lints]
workspace = true
