[package]
name = "cobalt-app"
description = "Cobalt desktop shell (Tauri v2): daemon host, IPC commands, tray, shortcuts, theme store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "cobalt"

[lib]
name = "cobalt_app_lib"
crate-type = ["rlib"]

[[bin]]
name = "cobalt"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cobalt-core = { workspace = true, features = ["hardware", "engines"] }
cobalt-store = { workspace = true, features = ["qdrant", "chroma"] }
cobalt-ingest.workspace = true
cobalt-mcp.workspace = true
cobalt-embeddings.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-notification = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json"] }
sha2 = "0.11"
hex = "0.4"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }

[features]
default = []
# LanceDB connector (heavy Arrow dependency tree; opt-in at build time).
lancedb = ["cobalt-store/lancedb"]

[lints]
workspace = true
